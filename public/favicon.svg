<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Sleek dark slate to near black -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101d" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>
    
    <!-- Primary Indigo Gradient (Material Indigo) -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5c6bc0" />
      <stop offset="100%" stop-color="#3f51b5" />
    </linearGradient>
    
    <!-- Secondary Cyan Gradient (Material Cyan) -->
    <linearGradient id="secondaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#00bcd4" />
    </linearGradient>
    
    <!-- Accent Amber Gradient (Material Amber) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffca28" />
      <stop offset="100%" stop-color="#ffb300" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f51b5" />
      <stop offset="50%" stop-color="#00bcd4" />
      <stop offset="100%" stop-color="#ffb300" />
    </linearGradient>

    <!-- Glow Effect for Curves -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Technical grid layout -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="3">
    <line x1="80" y1="140" x2="432" y2="140" />
    <line x1="80" y1="230" x2="432" y2="230" />
    <line x1="80" y1="320" x2="432" y2="320" />
    <line x1="80" y1="410" x2="432" y2="410" />
    
    <line x1="140" y1="80" x2="140" y2="432" />
    <line x1="230" y1="80" x2="230" y2="432" />
    <line x1="320" y1="80" x2="320" y2="432" />
    <line x1="410" y1="80" x2="410" y2="432" />
  </g>

  <!-- Decorative geometric details in corners -->
  <circle cx="80" cy="80" r="6" fill="#3f51b5" opacity="0.4" />
  <circle cx="432" cy="80" r="6" fill="#00bcd4" opacity="0.4" />
  <circle cx="80" cy="432" r="6" fill="#ffb300" opacity="0.4" />
  <circle cx="432" cy="432" r="6" fill="#3f51b5" opacity="0.4" />

  <!-- Amortization Bar Chart Structure (represents L) -->
  <g transform="translate(-10, 20)">
    <!-- Column 1 (Tiers / Start) -->
    <rect x="130" y="140" width="44" height="220" rx="10" fill="url(#primaryGrad)" />
    <!-- Column 2 (Recalculating mid-point) -->
    <rect x="194" y="210" width="44" height="150" rx="10" fill="url(#secondaryGrad)" />
    <!-- Column 3 (Final repayment stage) -->
    <rect x="258" y="270" width="44" height="90" rx="10" fill="url(#accentGrad)" />
  </g>

  <!-- Glowing Amortization curve + Crossing slash forming 'X' -->
  <g filter="url(#glow)">
    <!-- Principal depletion curve -->
    <path d="M 120 140 Q 230 300 392 380" fill="none" stroke="url(#secondaryGrad)" stroke-width="24" stroke-linecap="round" />
    
    <!-- Diagonal cross stroke completing the 'X' and percentage symbol look -->
    <line x1="392" y1="140" x2="120" y2="380" stroke="url(#primaryGrad)" stroke-width="24" stroke-linecap="round" />
  </g>

  <!-- Highlights/Nodes -->
  <circle cx="120" cy="140" r="14" fill="#5c6bc0" />
  <circle cx="120" cy="140" r="8" fill="#ffffff" />

  <circle cx="392" cy="380" r="14" fill="#00e5ff" />
  <circle cx="392" cy="380" r="8" fill="#ffffff" />
</svg>